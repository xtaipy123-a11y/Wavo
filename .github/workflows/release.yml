name: Release Wavo for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release version and tag
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $tag -ne $env:GITHUB_REF_NAME) {
            throw "Tag and package.json version do not match"
          }
          $remoteTags = @(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw "Could not check the release tag" }
          if ($remoteTags.Count -gt 0) {
            $peeled = @($remoteTags | Where-Object { $_.EndsWith('^{}') })
            $tagRef = if ($peeled.Count -gt 0) { $peeled[0] } else { $remoteTags[0] }
            $tagCommit = ($tagRef -split '\s+')[0]
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "$tag already points to another commit. Select that tag to rerun its release, or bump package.json for a new release."
            }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build app and Windows installer
        run: pnpm run release:win
        env:
          VITE_API_URL: https://api.tryliner.fun
          VITE_COVERS_PROXY_URL: https://covers.tryliner.fun
          VITE_SUPABASE_URL: https://fuojxlhsmivjgxcbhnyq.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_eXIjgCqlOQHnzcI037r1LQ_KAk3ruiW
      - name: Publish installer and update metadata
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            release/Wavo-Setup-*.exe
            release/Wavo-Setup-*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
